      --muted: #64748b;
      --line: #d9dee7;
      --bg: #f7f8fb;

    * {

    html,

      padding: clamp(28px, 7vw, 56px);
      border: 1px solid var(--line);
      background: #fff;
    }
    .eyebrow {
      margin: 0 0 18px;
      color: var(--gold);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .08em;
    }
    h1 {
      margin: 0;
      color: var(--navy);
      font-size: clamp(28px, 5vw, 42px);
      line-height: 1.35;
      letter-spacing: 0;
    }
    p {
      margin: 22px 0 0;
      color: var(--muted);
      font-size: 16px;
    }
    .company {
      margin-top: 36px;
      padding-top: 20px;
